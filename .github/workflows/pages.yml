name: Deploy browser game to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'tools/**'
      - 'original-preview/**'
      - 'source.wasm'
      - 'game.data'
      - 'framework.js'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Retrieve required original build and native bundles
        run: git lfs pull --include="source.wasm,game.data,original-preview/StreamingAssets/**"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build static game
        env:
          PAGES_BASE_PATH: /Kour-revamp/
          PHOTON_APP_ID: ${{ vars.PHOTON_APP_ID }}
        run: node tools/build-pages.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: local/pages-dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
